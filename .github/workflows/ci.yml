name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: cleanmol/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Dependency check
        working-directory: cleanmol/backend
        run: pip check
      - name: Run backend tests
        working-directory: cleanmol/backend
        run: pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cleanmol/frontend/package-lock.json
      - name: Install frontend
        working-directory: cleanmol/frontend
        run: npm ci
      - name: Basic dependency audit
        working-directory: cleanmol/frontend
        continue-on-error: true
        run: npm audit --audit-level=critical
      - name: Build frontend
        working-directory: cleanmol/frontend
        run: npm run build
