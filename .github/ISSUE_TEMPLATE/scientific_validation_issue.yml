name: Scientific validation issue
description: Report a scientific concern, benchmark problem, or ranking limitation.
title: "[Validation]: "
labels: ["scientific-validation"]
body:
  - type: textarea
    id: concern
    attributes:
      label: Scientific concern
      description: Include molecule names, SMILES, assay endpoints, or benchmark rows where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior or interpretation
  - type: textarea
    id: references
    attributes:
      label: Supporting references
